<!DOCTYPE html>
<html>
<head>
    <title>DB Debug</title>
</head>
<body>
    <pre id="output">Cargando...</pre>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        async function debug() {
            try {
                const client = supabase.createClient(window.supabaseUrl, window.supabaseKey);
                const { data, error } = await client.from('alumnos').select('*').limit(1);
                if (error) throw error;
                if (!data || data.length === 0) {
                    document.getElementById('output').textContent = 'No hay alumnos en la tabla.';
                    return;
                }
                const first = data[0];
                let out = 'Columnas y valores del primer registro:\n\n';
                for (let k in first) {
                    out += `${k}: ${first[k]} (${typeof first[k]})\n`;
                }
                document.getElementById('output').textContent = out;
            } catch (e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
        }
        debug();
    </script>
</body>
</html>
