<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scala - Menu de Procesos de Cobros</title>
    <link rel="stylesheet" href="caja.css">
    <script>
        // Funciones de navegación inmediatas para evitar "is not defined"
        window.irACobros = function() { window.location.href = 'cobros.html'; }
        window.irARecibosCancelados = function() { window.location.href = 'recibos_cancelados.html'; }
        window.irAConsultaBajas = function() { window.location.href = 'consulta-bajas.html'; }
        window.generarCorte1 = function() { window.location.href = 'cortes.html?corte=1'; }
        window.generarCorte2 = function() { window.location.href = 'cortes.html?corte=2'; }
        window.generarCorte3 = function() { window.location.href = 'cortes.html?corte=3'; }
        window.terminarCaja = function() { window.location.href = 'index.html'; }
    </script>
</head>

<body data-section="Caja">
    <div class="container">
        <header>
            <h1>Scala - Academia de música</h1>
            <h2>MENU DE PROCESOS DE COBROS</h2>
            <div class="datetime" id="datetime"></div>
        </header>

        <main>
            <div class="top-section">
                <div class="logo-container">
                    <img src="Scala_logo.png" alt="Scala Logo" id="mainLogo">
                </div>

                <button class="menu-btn top-left" data-section="Cobros" onclick="irACobros()">
                    COBROS
                </button>

                <button class="menu-btn top-right" data-section="Recibos Cancelados" onclick="irARecibosCancelados()">
                    RECIBOS<br>CANCELADOS
                </button>

                <button class="menu-btn center-btn" data-section="Consultas y Bajas" onclick="irAConsultaBajas()">
                    CONSULTA Y BAJAS
                </button>

            </div>

            <div class="bottom-section">
                <button class="menu-btn bottom-left" data-section="Corte 1" onclick="generarCorte1()">
                    CORTE 1
                </button>

                <div class="info-box">
                    FAVOR DE SELECCIONAR<br>EL REPORTE DE CORTE<br>QUE DESEA
                </div>

                <button class="menu-btn bottom-right" data-section="Corte 3" onclick="generarCorte3()">
                    CORTE 3
                </button>

                <button class="menu-btn bottom-center" data-section="Corte 2" onclick="generarCorte2()">
                    CORTE 2
                </button>
            </div>
        </main>

        <footer>
            <button class="exit-btn" onclick="terminarCaja()">
                TERMINAR
            </button>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="session-manager.js"></script>
    <script src="utils-inputs.js"></script>
    <script src="caja.js"></script>
</body>

</html>
