<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Cursos - Scala</title>
    <link rel="stylesheet" href="grupos-listado.css">
    <style>
        #buscarInput {
            background-color: #ffff00 !important;
            color: #000 !important;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- Barra de Menú Nativa -->
        <nav class="menu-bar">
            <span class="menu-item">Archivo</span>
            <span class="menu-item">Módulos</span>
            <span class="menu-item">Ver</span>
            <span class="menu-item">Ayuda</span>
        </nav>

        <header>
            <h1>Listado de Cursos</h1>
        </header>

        <div class="content-area">
            <div class="table-wrapper">
                <table class="data-table" id="tblCursos">
                    <thead>
                        <tr>
                            <th class="selector-cell"></th>
                            <th>Clave</th>
                            <th>Curso</th>
                            <th>Grado</th>
                            <th>Costo</th>
                            <th>IVA</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCursos">
                        <!-- Se carga vía JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="pagination-nav">
            <span>Registro:</span>
            <button class="btn-nav" id="btnFirst">|◄</button>
            <button class="btn-nav" id="btnPrev">◄</button>
            <input type="text" class="page-input" id="currentPage" value="1" readonly>
            <button class="btn-nav" id="btnNext">►</button>
            <button class="btn-nav" id="btnLast">►|</button>
            <span id="regTotal">de 0</span>
        </div>

        <footer>
            <div class="search-box">
                <input type="text" id="buscarInput" placeholder="Buscar por Curso o Clave ..." autofocus>
            </div>
            <button class="btn-close" id="btnClose">Cerrar consulta</button>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="session-manager.js"></script>
    <script src="cursos-lista.js"></script>
</body>

</html>
