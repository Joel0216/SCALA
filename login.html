<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scala - Inicio de Sesión</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.7); /* Slate 900 */
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #818cf8; /* Indigo 400 */
            --accent-secondary: #c084fc; /* Purple 400 */
            --text-light: #f8fafc;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            color: var(--text-light);
        }

        .login-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-login {
            width: 100px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(129, 140, 248, 0.5));
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 40px;
            font-weight: 200;
            letter-spacing: 6px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold; /* Texto en negritas solicitado */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
            transform: scale(1.01);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px -10px rgba(129, 140, 248, 0.5);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(129, 140, 248, 0.6);
            filter: brightness(1.1);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #fb7185;
            font-size: 14px;
            margin-top: 20px;
            background: rgba(251, 113, 133, 0.1);
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="Scala_logo.png" alt="Scala Logo" class="logo-login" id="appLogo">
        <h1>S C A L A</h1>
        <form id="loginForm">
            <div class="input-group">
                <label>Usuario o Correo</label>
                <input type="text" id="username" placeholder="Ingrese su usuario..." required autofocus>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">
                <span id="btnText">INGRESAR</span>
                <div id="spinner" class="loading-spinner"></div>
            </button>
            <div id="errorMsg" class="error-msg">Credenciales incorrectas</div>
        </form>
    </div>

    <script src="supabase-config.js"></script>
    <script src="login.js"></script>
</body>
</html>
