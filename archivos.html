<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scala - Menu de Archivos</title>
    <link rel="stylesheet" href="archivos.css">
</head>
<body data-section="Archivos">
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Scala</h1>
            <h2>MENU DE ARCHIVOS</h2>
            <div class="datetime" id="datetime"></div>
            <!-- Selector de Organización SuperAdmin -->
            <div id="superAdminSelectorContainer" style="display:none; text-align:center; margin-top: 15px;">
                <label for="superAdminOrgSelect" style="color:#000; font-weight:bold; margin-right: 10px;">Seleccionar Organización:</label>
                <select id="superAdminOrgSelect" style="padding: 5px; border-radius: 5px; border: 1px solid #000;">
                    <option value="">-- Elige una Organización --</option>
                </select>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="menu-grid">
                <!-- Logo Central -->
                <div class="logo-container">
                    <img src="Scala_logo.png" alt="Scala Logo" id="mainLogo">
                </div>

                <!-- Archivos Button -->
                <button class="menu-btn col1-row1" data-section="Alumnos" onclick="window.location.href='alumnos.html'">
                    ALUMNOS
                </button>
                <button class="menu-btn col1-row2" data-section="Maestros" onclick="window.location.href='maestros.html'">
                    MAESTROS
                </button>
                <button class="menu-btn col1-row3" data-section="Cursos" onclick="window.location.href='cursos.html'">
                    CURSOS
                </button>
                <button class="menu-btn col1-row4" data-section="Articulos" onclick="window.location.href='articulos.html'">
                    ARTICULOS
                </button>
                <button class="menu-btn col1-row5" data-section="Movim. Inventario" onclick="window.location.href='movimientos-inventario.html'">
                    MOVIMIENTOS<br>INVENTARIOS
                </button>

                <!-- Column 2 -->
                <button class="menu-btn col2-row1" data-section="Bajas" onclick="window.location.href='alumnos-bajas.html'">
                    BAJAS
                </button>
                <button class="menu-btn col2-row3" data-section="Grupos" onclick="window.location.href='grupos.html'">
                    GRUPOS
                </button>
                <button class="menu-btn col2-row4" data-section="Grupos de Articulos" onclick="window.location.href='grupos-articulos.html'">
                    GRUPOS<br>ARTICULOS
                </button>

                <!-- Column 3 -->
                <button class="menu-btn col3-row1" data-section="Reg Prospectos" onclick="window.location.href='prospectos.html'">
                    Reg Prospectos
                </button>
                <button class="menu-btn col3-row2" data-section="OTROS CATALOGOS" onclick="window.location.href='otros-catalogos.html'">
                    OTROS<br>CATALOGOS
                </button>

                <!-- Bottom Row -->
                <button class="menu-btn bottom-row1" data-section="R.F.C.'s" onclick="window.location.href='rfc-clientes.html'">
                    RFC Clientes
                </button>
                <button class="menu-btn bottom-row2" data-section="Horarios" onclick="window.location.href='horarios.html'">
                    HORARIOS
                </button>
                <button class="menu-btn bottom-row3" data-section="EXAMENES" onclick="window.location.href='examenes-menu.html'">
                    EXAMENES
                </button>
            </div>
        </main>

        <!-- Exit Button -->
        <footer>
            <button class="exit-btn" onclick="window.location.href='index.html'">
                TERMINAR
            </button>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>`n    <script src="supabase-config.js"></script>
    <script src="session-manager.js"></script>
    <script src="utils-inputs.js"></script>
    <script src="archivos.js"></script>
</body>
</html>
