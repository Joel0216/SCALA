<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCALA - Consulta y Bajas</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body data-section="Consultas y Bajas">
    <div class="app-main" style="max-width: 900px; padding: 40px;">
        <header class="app-header premium-card" style="margin-bottom: 20px; border-radius: var(--radius-md); padding: 20px 25px;">
            <div>
                <h1 style="color: var(--white); margin: 0; font-size: 1.5rem;">Consulta y Bajas</h1>
            </div>
            <div id="datetime" style="font-weight: 500;"></div>
        </header>

        <div class="premium-card">
            <div class="premium-grid grid-cols-2" style="gap: 20px;">
                <button class="premium-btn btn-primary" onclick="irAConsultaRecibos()" style="padding: 25px; font-size: 1.1rem; flex-direction: column; gap: 10px;">Consulta de Recibos</button>
                <button class="premium-btn btn-primary" onclick="irARecibosCancelados()" style="padding: 25px; font-size: 1.1rem; flex-direction: column; gap: 10px;">Recibos Cancelados</button>
                <button class="premium-btn btn-secondary" onclick="irABajasAlumnos()" style="padding: 25px; font-size: 1.1rem; flex-direction: column; gap: 10px;">Bajas de Alumnos</button>
                <button class="premium-btn btn-secondary" onclick="irAReingresos()" style="padding: 25px; font-size: 1.1rem; flex-direction: column; gap: 10px;">Reingresos</button>
            </div>
            
            <div style="margin-top: 30px; display: flex; justify-content: flex-end; padding-top: 20px; border-top: 1px solid var(--color-lavender);">
                <button class="premium-btn btn-outline" onclick="volverCaja()">Volver a Caja</button>
            </div>
        </div>
    </div>

    <script src="consulta-bajas.js"></script>
</body>
</html>
