<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scala - Academias de Música</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-section="Menu Principal">
    <div class="container">
        <!-- Header -->
        <header class="app-header" style="display: flex; flex-direction: column; align-items: center; padding: 20px 40px; background: var(--primary-gradient);">
            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div id="userProfile" style="color: white; font-size: 0.9rem; font-weight: 500;">
                    <span id="welcomeName">Bienvenido</span> | <a href="#" onclick="SessionManager.logout()" style="color: #fff; text-decoration: underline; opacity: 0.8;">Cerrar Sesión</a>
                </div>
                <div class="datetime" id="datetime" style="color: white; font-size: 0.9rem; font-weight: 500;"></div>
            </div>
            <h1 style="color: white; font-size: 2.2rem; letter-spacing: 2px; margin: 5px 0;">Scala - <span id="orgTitle">Academias de Música</span></h1>
            <h2 style="color: rgba(255,255,255,0.9); font-size: 1rem; font-weight: 400; text-transform: uppercase; letter-spacing: 4px;">MENU PRINCIPAL</h2>
        </header>

        <!-- Main Content -->
        <main>
            <div class="menu-grid">
                <!-- Archivos Button -->
                <button class="menu-btn top-left" data-section="ARCHIVOS" onclick="window.location.href='archivos.html'">
                    ARCHIVOS
                </button>

                <!-- Reportes Button -->
                <button class="menu-btn top-right" data-section="REPORTES" onclick="window.location.href='reportes.html'">
                    REPORTES
                </button>

                <!-- Logo Central -->
                <div class="logo-container">
                    <img src="Scala_logo.png" alt="Scala Logo" id="mainLogo">
                </div>

                <!-- Seguridad Button -->
                <button class="menu-btn middle-left" data-section="SEGURIDAD" onclick="window.location.href='seguridad.html'">
                    SEGURIDAD
                </button>


                <!-- Caja Button -->
                <button class="menu-btn bottom-center" data-section="CAJA" onclick="window.location.href='caja.html'">
                    CAJA
                </button>
            </div>
        </main>

        <!-- Exit Button -->
        <!-- Exit Button -->
        <footer class="app-footer" style="justify-content: center; padding: 25px; background: transparent; border: none;">
            <button class="premium-btn btn-danger" style="padding: 15px 40px; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(238, 82, 83, 0.3);" onclick="exitSystem()">
                Salida del Sistema
            </button>
            <div style="position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px;">
                <button class="premium-btn btn-outline" style="padding: 8px 15px; font-size: 0.8rem; background: var(--white);" onclick="window.location.href='diagnostico.html'">
                    🔧 Diagnóstico
                </button>
                <button class="premium-btn btn-outline" style="padding: 8px 15px; font-size: 0.8rem; background: var(--white);" onclick="window.location.href='test-require.html'">
                    🔌 Test BD
                </button>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>`n    <script src="supabase-config.js"></script>
    <script src="session-manager.js"></script>
    <script src="utils-inputs.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = SessionManager.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Actualizar UI con datos del usuario (lo demás lo hace SessionManager)
            const welcomeEl = document.getElementById('welcomeName');
            if (welcomeEl) welcomeEl.textContent = `Hola, ${user.nombre}`;
            
            // SessionManager.loadBranding() se ejecuta automáticamente por session-manager.js
            
            // Aplicar protección de seguridad (ocultar botones de módulos sin acceso)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.protectPage('Menu Principal');
            }
        });
    </script>
</body>
</html>
